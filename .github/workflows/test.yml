name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install numpy scipy pytest
      - name: Smoke tests
        run: python tests/test_smoke.py
      - name: Network direction tests
        run: python tests/test_network_direction.py
      - name: Identifiability tests
        run: python tests/test_identifiability.py
      - name: Validation suite (quick)
        run: python -m dynamics_simulation.validation --quick
      - name: Full pytest suite
        run: python -m pytest tests -v
